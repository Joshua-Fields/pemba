# A stored wildcard `t:*` matches objects of type `t`, never a subject set `t:x#r`
# (docs/04-evaluation.md §3.3). SpiceDB matches the subject set too: KD-3 in
# crates/warden-difftest/KNOWN_DIFFERENCES.md. The differential test sees both directions
# here: on the grant side warden says false where SpiceDB says true; on the subtracted
# side of an exclusion warden says true where SpiceDB says false.
schema: |-
  definition user {}

  definition grp {
      relation member: user
  }

  definition doc {
      relation viewer: grp:* | grp#member
  }

  definition page {
      relation viewer: grp#member
      relation banned: grp:*
      permission view = viewer - banned
  }

relationships: |-
  grp:g#member@user:anne
  doc:d#viewer@grp:*
  page:p#viewer@grp:g#member
  page:p#banned@grp:*

assertions:
  assertTrue:
    - doc:d#viewer@grp:g
    - doc:d#viewer@grp:anyone
    # Subtracted side: the wildcard bans every grp object, not the subject set.
    - page:p#view@grp:g#member
  assertFalse:
    # Grant side: the wildcard does not match the subject set.
    - doc:d#viewer@grp:g#member
    # Only the subject set grp:g#member is a viewer, not the object grp:g.
    - page:p#view@grp:g
