[package]
name = "pemba-core"
description = "Core of pemba: model types, store traits, write logic, evaluator and Engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["authentication"]

[lints]
workspace = true

[dependencies]
pemba-schema.workspace = true
thiserror.workspace = true
tracing.workspace = true

# The playground build's clock (ADR-016): std's `Instant::now` traps on wasm32-unknown-unknown.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1.0"

[dev-dependencies]
proptest.workspace = true
# Checks the hand-written trace JSON escaper against a real parser (dev-only; the library
# stays serde-free). Already in the tree via pemba-difftest.
serde_json = "1.0.154"
