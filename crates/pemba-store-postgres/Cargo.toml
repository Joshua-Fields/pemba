[package]
name = "pemba-store-postgres"
description = "Postgres relationship store for pemba."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["authentication", "database"]

[lints]
workspace = true

[features]
default = ["tls"]
# rustls rather than OpenSSL, so manylinux wheels need no system TLS library (docs/10-postgres.md §2.1).
tls = ["dep:rustls", "dep:rustls-native-certs", "dep:tokio-postgres-rustls"]

[dependencies]
pemba-core.workspace = true
tracing.workspace = true
# Sync client (docs/10-postgres.md §2.1); no async in any pemba crate.
postgres = "0.19.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8.5", optional = true }
tokio-postgres-rustls = { version = "0.14.0", optional = true }

[dev-dependencies]
pemba-testkit.workspace = true
# Store equivalence, memory ≡ SQLite ≡ Postgres (docs/10-postgres.md §4 item 2).
pemba-store-memory.workspace = true
pemba-store-sqlite.workspace = true
proptest.workspace = true
# Only for the test that pins how the blocking client behaves inside a runtime.
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros"] }

[[example]]
name = "transactional_postgres"
path = "../../examples/transactional_postgres.rs"
