[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "pemba"
description = "Embedded, Zanzibar-style authorisation engine."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# Copies of the repository root's files: PEP 639 does not allow `..` here. CI checks they
# match the originals.
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Joshua-Fields/pemba"
Repository = "https://github.com/Joshua-Fields/pemba"
Issues = "https://github.com/Joshua-Fields/pemba/issues"

[project.optional-dependencies]
test = ["pytest>=9.1", "mypy>=2.4"]
# tests/test_postgres.py: the drivers foreign mode supports (docs/10-postgres.md §2.3).
postgres-test = [
    "psycopg[binary]>=3.2",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "django>=5.0",
    "greenlet>=3.0",
]
# bench/test_scenarios.py (docs/07-testing.md §7)
bench = ["pytest>=9.1", "pytest-benchmark>=5.3"]

[tool.maturin]
python-source = "python"
module-name = "pemba._pemba"
# maturin packages everything under python/, ignored or not: keep out bytecode and the
# extension (with its Windows debug symbols) that `maturin develop` leaves there. The
# built extension is added separately.
exclude = [
    "python/**/__pycache__/**",
    "python/**/*.pyd",
    "python/**/*.pdb",
    "python/**/*.so",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

# tests/test_postgres.py imports Django, which ships no type information and is installed
# only where the Postgres tests run. An override (not inline ignores) passes both with and
# without it: an inline `import-untyped` ignore becomes `import-not-found` plus
# `unused-ignore` where Django is absent.
[[tool.mypy.overrides]]
module = ["django", "django.*"]
ignore_missing_imports = true
