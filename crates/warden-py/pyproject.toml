[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "warden"
description = "Embedded, Zanzibar-style authorisation engine."
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=9.1", "mypy>=2.4"]

[tool.maturin]
python-source = "python"
module-name = "warden._warden"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
