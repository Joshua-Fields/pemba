[package]
name = "warden-cli"
description = "Command-line tool for warden."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "warden"
path = "src/main.rs"
# Rustdoc output for this bin would overwrite the `warden` lib docs (cargo#6313).
doc = false

[lints]
workspace = true

[dependencies]
warden = { workspace = true, features = ["sqlite", "memory"] }
warden-schema.workspace = true
clap.workspace = true
# `warden test` runs fixtures against the engine alone (docs/07-testing.md §3, OQ-024).
warden-fixtures.workspace = true

[dev-dependencies]
insta.workspace = true
