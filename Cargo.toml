[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
authors = ["Joshua Fields"]

# Internal crates carry a version so `cargo deny` does not treat them as wildcard deps.
[workspace.dependencies]
warden-schema = { path = "crates/warden-schema", version = "0.0.0" }
warden-core = { path = "crates/warden-core", version = "0.0.0" }
warden-store-memory = { path = "crates/warden-store-memory", version = "0.0.0" }
warden-store-sqlite = { path = "crates/warden-store-sqlite", version = "0.0.0" }
warden = { path = "crates/warden", version = "0.0.0", default-features = false }
warden-testkit = { path = "crates/warden-testkit", version = "0.0.0" }

thiserror = "2.0.21"
proptest = "1.12.0"
insta = "1.49.0"
sha2 = { version = "0.11.1", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"          # overridden to "allow" only in warden-py if PyO3 requires
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Property tests (`docs/07-testing.md` §2.3) run 1 000+ generated cases through the engine,
# whose uncached re-evaluation of cyclic data makes that slow unoptimised. Only affects
# `cargo test` builds.
[profile.test.package.warden-testkit]
opt-level = 3

[profile.test.package.warden-core]
opt-level = 3

[profile.test.package.warden-store-memory]
opt-level = 3

[profile.test.package.warden-schema]
opt-level = 3
