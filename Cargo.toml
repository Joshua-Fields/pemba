[workspace]
resolver = "3"
members = ["crates/*", "benches"]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
authors = ["Joshua Fields"]
repository = "https://github.com/Joshua-Fields/pemba"
readme = "README.md"
keywords = ["authorization", "zanzibar", "rebac", "permissions", "sqlite"]

# Internal crates carry a version so `cargo deny` does not treat them as wildcard deps.
[workspace.dependencies]
pemba-schema = { path = "crates/pemba-schema", version = "0.1.0-alpha.2" }
pemba-core = { path = "crates/pemba-core", version = "0.1.0-alpha.2" }
pemba-store-memory = { path = "crates/pemba-store-memory", version = "0.1.0-alpha.2" }
pemba-store-sqlite = { path = "crates/pemba-store-sqlite", version = "0.1.0-alpha.2" }
pemba-sqlite-common = { path = "crates/pemba-sqlite-common", version = "0.1.0-alpha.2" }
pemba-store-pysqlite = { path = "crates/pemba-store-pysqlite", version = "0.1.0-alpha.2" }
pemba-store-postgres = { path = "crates/pemba-store-postgres", version = "0.1.0-alpha.2" }
pemba = { path = "crates/pemba", version = "0.1.0-alpha.2", default-features = false }
pemba-fixtures = { path = "crates/pemba-fixtures", version = "0.1.0-alpha.2" }
pemba-testkit = { path = "crates/pemba-testkit" }

thiserror = "2.0.21"
proptest = "1.12.0"
insta = "1.49.0"
sha2 = { version = "0.11.1", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }

[workspace.lints.rust]
unsafe_code = "forbid"          # overridden to "allow" only in pemba-py if PyO3 requires
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Property tests (`docs/07-testing.md` §2.3) run 1 000+ generated cases through the engine,
# whose uncached re-evaluation of cyclic data makes that slow unoptimised. Only affects
# `cargo test` builds.
[profile.test.package.pemba-testkit]
opt-level = 3

[profile.test.package.pemba-core]
opt-level = 3

[profile.test.package.pemba-store-memory]
opt-level = 3

[profile.test.package.pemba-schema]
opt-level = 3
