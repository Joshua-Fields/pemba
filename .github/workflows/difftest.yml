name: Differential test vs SpiceDB

# pemba against SpiceDB on every fixture and at least 500 generated cases
# (docs/07-testing.md §4, T3.4). Weekly, on demand, and on pull requests that touch what
# decides answers (the evaluator, the schema compiler, the harness, the fixtures or the
# locked dependencies): it needs Docker and takes minutes, so not on every PR.
on:
  schedule:
    - cron: "41 4 * * 1"
  pull_request:
    paths:
      - "crates/pemba-core/**"
      - "crates/pemba-schema/**"
      - "crates/pemba-difftest/**"
      - "testdata/fixtures/**"
      - "Cargo.lock"
      - ".github/workflows/difftest.yml"
  workflow_dispatch:
    inputs:
      cases:
        description: "Generated cases to compare (PEMBA_DIFFTEST_CASES, at least 500)"
        default: "500"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request cancels the older run; others always finish (09 §4).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  difftest:
    # pemba's side on the memory store, and on Postgres (docs/10-postgres.md §4 item 3,
    # T5.11). SpiceDB stays on serve-testing: its datastore does not change the semantics
    # being compared.
    name: pemba (${{ matrix.store }}) vs SpiceDB
    runs-on: ubuntu-latest
    # On Postgres every engine gets a fresh schema and every read is a round trip: the
    # 500 cases took 61 minutes locally (Docker on Windows).
    timeout-minutes: ${{ matrix.store == 'postgres' && 120 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        store: [memory, postgres]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Build the tests before SpiceDB starts (it holds every datastore in memory)
        run: cargo test -p pemba-difftest --no-run
      # serve-testing: an isolated in-memory datastore per bearer token, no preshared key.
      # The version is pinned so a SpiceDB release cannot change the results unannounced;
      # KNOWN_DIFFERENCES.md names the version it was compared against.
      - name: Start SpiceDB
        run: |
          docker run -d --name spicedb -p 8443:8443 authzed/spicedb:v1.56.2 serve-testing --http-enabled
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8443/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs spicedb
          exit 1
      - name: Compare
        env:
          PEMBA_SPICEDB_URL: http://127.0.0.1:8443
          PEMBA_SPICEDB_KEY: difftest
          PEMBA_DIFFTEST_REQUIRED: "1"
          PEMBA_DIFFTEST_CASES: ${{ inputs.cases || '500' }}
          PEMBA_DIFFTEST_STORE: ${{ matrix.store }}
          PEMBA_PG_URL: postgres://postgres@localhost:5432/postgres
        # One test at a time: two at once more than double SpiceDB's memory.
        run: cargo test -p pemba-difftest --test difftest -- --ignored --nocapture --test-threads=1
      - name: SpiceDB log on failure
        if: failure()
        run: docker logs spicedb 2>&1 | tail -200
