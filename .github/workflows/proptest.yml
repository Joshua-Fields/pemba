name: Property tests (full)

# Manual runs at a larger case count. ci.yml already runs property 1 at 1 000 cases on
# every push to main and every pull request (its `prop1` job); use this to soak it at
# PROPTEST_CASES well above that.
on:
  workflow_dispatch:
    inputs:
      cases:
        description: "PROPTEST_CASES (at least 1000)"
        default: "1000"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  prop1:
    name: property 1, full case count
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # Only the properties binary: warden-difftest's ignored tests need SpiceDB
      # (difftest.yml).
      - run: cargo test -p warden-testkit --test properties -- --ignored
        env:
          PROPTEST_CASES: ${{ inputs.cases }}
