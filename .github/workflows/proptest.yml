name: Property tests (full)

# Soak runs of the property tests at a raised PROPTEST_CASES, weekly and on demand.
# ci.yml's `prop1` job already runs the same tests at 1 000 cases on every push and PR.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      cases:
        description: "PROPTEST_CASES (above ci.yml's 1000)"
        default: "10000"
      postgres_cases:
        description: "PROPTEST_CASES for the Postgres entry (exact; each read is a round trip)"
        default: "200"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  prop1:
    name: properties, raised case count
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # Only the properties binary: pemba-difftest's ignored tests need SpiceDB
      # (difftest.yml). `prop1_*_full`, `prop4_*_full` (historical reads, both stores, ~8 s)
      # `prop5_*_full` (memory ≡ SQLite, ~25 s), `prop2_*_full` (lookup_resources, both
      # stores, ~8 s), `prop3_*_full` (lookup_subjects, both stores, ~8 s) and
      # `schema_change_*_full` run at least 1 000 cases each; `prop4_*_full` includes GC.
      # Property 7 (`trace::*_full`, check_with_trace on both stores) is in the
      # properties binary too.
      - run: cargo test -p pemba-testkit --test properties -- --ignored
        env:
          PROPTEST_CASES: ${{ inputs.cases || '10000' }}
      # The other trace properties: ids through the trace JSON (`tests/trace.rs`) and the
      # JSON string escaper (pemba-core). Each runs at least its own floor, or
      # PROPTEST_CASES if higher.
      - name: trace JSON properties, raised case count
        run: |
          cargo test -p pemba-testkit --test trace
          cargo test -p pemba-core --lib trace::
        env:
          PROPTEST_CASES: ${{ inputs.cases || '10000' }}

  postgres:
    # Properties 1–4 and 7 (engine vs reference) with every case also on a Postgres store
    # (docs/10-postgres.md §4 item 2, T5.11). Fewer cases: every read is a round trip, so
    # with PEMBA_PROPTEST_STORE=postgres, PROPTEST_CASES is the count exactly.
    name: properties on Postgres ${{ matrix.pg }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: "cargo test --release -p pemba-testkit --test properties -- --include-ignored prop1 prop2 prop3 prop4 trace::"
        env:
          PEMBA_PROPTEST_STORE: postgres
          PEMBA_PG_URL: postgres://postgres@localhost:5432/postgres
          PROPTEST_CASES: ${{ inputs.postgres_cases || '200' }}
