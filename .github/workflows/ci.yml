name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# The toolchain is pinned by rust-toolchain.toml; rustup on the runners installs it on first use.
jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  prop1:
    name: property 1, 1000 cases
    runs-on: ubuntu-latest
    # ~1 s locally since T1.4c bounded check cost (OQ-021); the cap catches a regression to
    # exponential cost instead of letting it run for the default six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # Only the properties binary: warden-difftest's ignored tests need SpiceDB
      # (difftest.yml). `prop1_check_matches_reference_full` runs at least 1 000 cases.
      - run: cargo test -p warden-testkit --test properties -- --ignored

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  doc:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features
