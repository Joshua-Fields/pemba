name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR cancels the older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# The toolchain is pinned by rust-toolchain.toml; rustup on the runners installs it on first use.
jobs:
  changes:
    # Docs-only PRs skip the heavy jobs (`if: needs.changes.outputs.code == 'true'`).
    # `paths-ignore` would skip the whole workflow, and fmt, the package-file copies and
    # rustdoc must run on every change. A skipped job counts as passed for required checks.
    # Docs-only means every changed path is under docs/ or assets/, or is a .md file other
    # than the root README.md (pemba-cli's tests run its `--explain` example). Pushes to
    # main always run everything.
    name: detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          # A PR checks out its merge commit, whose first parent is the base branch.
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^1 HEAD | tee changed.txt
          if grep -qvE '^(docs|assets)/|\.md$' changed.txt \
             || grep -qx 'README.md' changed.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --all -- --check
      # fuzz/ is its own workspace, so `--all` above does not reach it.
      - run: cd fuzz && cargo fmt -- --check

  package-files:
    # Published crates and the Python package each carry copies of the root LICENSE and
    # NOTICE (Apache-2.0 requires both to ship), and pemba-py a copy of README.md, because
    # neither cargo nor PEP 639 can package files from outside the package directory.
    name: package file copies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: copies match the repository root
        run: |
          status=0
          for d in pemba pemba-core pemba-schema pemba-store-memory pemba-sqlite-common \
                   pemba-store-sqlite pemba-store-postgres pemba-fixtures pemba-cli pemba-py; do
            for f in LICENSE NOTICE; do
              cmp -s "$f" "crates/$d/$f" || { echo "::error::crates/$d/$f differs from $f"; status=1; }
            done
          done
          cmp -s README.md crates/pemba-py/README.md || { echo "::error::crates/pemba-py/README.md differs from README.md"; status=1; }
          exit $status

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # pemba-store-pysqlite's tests embed an interpreter (conformance suite, property 5).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Point PyO3 at that interpreter
        shell: bash
        run: |
          echo "PYO3_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          echo "PYTHONHOME=$(python -c 'import sys; print(sys.base_prefix)')" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Linux ]; then
            echo "LD_LIBRARY_PATH=$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')" >> "$GITHUB_ENV"
          fi
      - run: cargo test --workspace --all-features

  python:
    name: python (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: crates/pemba-py
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # The abi3 floor (ADR-014): proves the wheel works on the oldest supported CPython.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: maturin develop, pytest, mypy --strict
        run: |
          python -m venv .venv
          if [ -d .venv/Scripts ]; then source .venv/Scripts/activate; else source .venv/bin/activate; fi
          pip install maturin==1.15.0 pytest==9.1.1 mypy==2.4.0
          maturin develop
          python ci/check_no_sqlite.py
          pytest -q
          mypy --strict tests
      # The shipped artefact, not just the dev build (ADR-006, OQ-032).
      - name: release wheel bundles no SQLite
        run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          maturin build --release --out dist
          python -c "import sys, zipfile; z = zipfile.ZipFile(sys.argv[1]); [open(n.rsplit('/', 1)[-1], 'wb').write(z.read(n)) for n in z.namelist() if '_pemba' in n]" dist/*.whl
          python ci/check_no_sqlite.py _pemba.*

  python-oldest:
    # The oldest combination docs/05-storage.md §4.3 claims: CPython 3.11 (the abi3 floor,
    # ADR-014) on SQLite 3.26.0 (MIN_SQLITE_VERSION), as Rocky Linux 8 ships them.
    name: python (Rocky Linux 8, Python 3.11, SQLite 3.26.0)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: rockylinux/rockylinux:8
    # A stalled dnf mirror once held this job for over an hour; fail fast instead.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: crates/pemba-py
    steps:
      # dnf spent 5–10 min here on slow mirrors. Its cache (metadata and RPMs, ~300 MB) is
      # kept per ISO week: dnf still refreshes expired metadata and installs the current
      # packages, but mostly from the cache. tar and gzip ship in the image.
      - name: dnf cache key
        id: dnf-week
        working-directory: /
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: /var/cache/dnf
          key: dnf-rockylinux8-${{ steps.dnf-week.outputs.week }}
          restore-keys: dnf-rockylinux8-
      # Only BaseOS and AppStream supply these packages; extras is disabled.
      - name: system packages
        working-directory: /
        run: >-
          dnf install -y
          --disablerepo='*' --enablerepo=baseos,appstream
          --setopt=fastestmirror=True --setopt=max_parallel_downloads=10 --setopt=keepcache=True
          --setopt=install_weak_deps=False --setopt=timeout=60 --setopt=retries=5
          python3.11 python3.11-pip gcc git
      - uses: actions/checkout@v5
      - name: Rust (version from rust-toolchain.toml)
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: check the combination
        run: |
          python3.11 -c "import sqlite3, sys; print(sys.version, sqlite3.sqlite_version); assert sys.version_info[:2] == (3, 11); assert sqlite3.sqlite_version == '3.26.0'"
      - name: maturin develop, pytest
        run: |
          python3.11 -m venv .venv
          source .venv/bin/activate
          pip install maturin==1.15.0 pytest==9.1.1
          maturin develop
          python ci/check_no_sqlite.py
          python -c "import pemba; assert pemba.MIN_SQLITE_VERSION == '3.26.0'"
          pytest -q

  prop1:
    # Properties 1 to 5 and schema change at >= 1 000 cases each, on every PR (Linux only).
    name: property 1, 1000 cases
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # ~1 min since T1.4c bounded check cost (OQ-021); the cap catches a regression to
    # exponential cost instead of letting it run for the default six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # Only the properties binary: pemba-difftest's ignored tests need SpiceDB
      # (difftest.yml). `prop1_*_full`, `prop4_*_full` (historical reads, both stores, ~8 s)
      # `prop5_*_full` (memory ≡ SQLite, ~25 s), `prop2_*_full` (lookup_resources, both
      # stores, ~8 s), `prop3_*_full` (lookup_subjects, both stores, ~8 s) and
      # `schema_change_*_full` run at least 1 000 cases each; `prop4_*_full` includes GC.
      - run: cargo test -p pemba-testkit --test properties -- --ignored

  postgres:
    # The Postgres store against each supported server (docs/10-postgres.md §4): the oldest
    # supported (15) and the newest (18). Service containers need Linux runners. The test
    # job above runs the same tests without PEMBA_PG_URL, where they report "not run".
    name: postgres ${{ matrix.pg }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PEMBA_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      PEMBA_PG_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p pemba-store-postgres --all-features
      # The plaintext-only build still compiles and passes.
      - run: cargo test -p pemba-store-postgres --no-default-features

  publish:
    # Every publishable crate packages and builds from its .crate alone (T3.3). Never
    # uploads: publishing is a manual human step.
    name: cargo publish --dry-run
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --workspace --dry-run --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  fuzz-check:
    # fuzz/ is its own workspace (cargo-fuzz runs it on nightly, fuzz.yml / OQ-039), so no
    # job above builds it and a broken fuzz target would go unnoticed until someone fuzzes.
    # `cargo check` needs no nightly: libfuzzer-sys builds on the pinned stable toolchain
    # (rust-toolchain.toml, found from fuzz/ too); only `cargo fuzz run` needs nightly.
    # `--locked`: fuzz/Cargo.lock must keep up with the workspace versions.
    name: fuzz targets build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          # Its own cache, apart from the main workspace's target/.
          workspaces: "fuzz -> target"
          key: fuzz
      - run: cd fuzz && cargo check --all-targets --locked

  doc:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features
