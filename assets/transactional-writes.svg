<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Service-based authorisation versus pemba</title>
  <desc id="desc">Left: with a separate authorisation service, the application writes the row to its own database and the relationship to an authorisation service with its own database; this dual write lets the two drift apart when either write fails. Right: with pemba, the application writes the row and the relationship to its own database in one transaction.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/>
    </marker>
  </defs>

  <!-- A solid light card, so the diagram reads the same on light and dark pages. -->
  <rect x="0.5" y="0.5" width="899" height="379" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <line x1="550" y1="30" x2="550" y2="350" stroke="#d0d7de" stroke-width="1.5"/>

  <g fill="#1f2328">
    <!-- Left: service-based authorisation. -->
    <text x="40" y="50" font-size="16" font-weight="600">Service-based authorisation: two databases</text>

    <rect x="210" y="75" width="160" height="44" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="290" y="102" font-size="14" text-anchor="middle">Application</text>

    <line x1="250" y1="119" x2="152" y2="250" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="190" y="175" font-size="13" text-anchor="end" fill="#57606a">1. write the row</text>

    <line x1="330" y1="119" x2="418" y2="163" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="372" y="126" font-size="13" fill="#57606a">2. write the relationship</text>

    <rect x="370" y="165" width="150" height="44" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="445" y="192" font-size="14" text-anchor="middle">Authz service</text>

    <line x1="445" y1="209" x2="445" y2="250" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

    <path d="M50 265 v44 a80 10 0 0 0 160 0 v-44" fill="#f6f8fa" stroke="#57606a"/>
    <ellipse cx="130" cy="265" rx="80" ry="10" fill="#f6f8fa" stroke="#57606a"/>
    <text x="130" y="297" font-size="14" text-anchor="middle">App database</text>

    <path d="M365 265 v44 a80 10 0 0 0 160 0 v-44" fill="#f6f8fa" stroke="#57606a"/>
    <ellipse cx="445" cy="265" rx="80" ry="10" fill="#f6f8fa" stroke="#57606a"/>
    <text x="445" y="297" font-size="14" text-anchor="middle">Authz database</text>

    <line x1="214" y1="290" x2="361" y2="290" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="287" y="335" font-size="13" text-anchor="middle" fill="#cf222e">dual write: if either fails,</text>
    <text x="287" y="353" font-size="13" text-anchor="middle" fill="#cf222e">the two drift apart</text>

    <!-- Right: pemba. -->
    <text x="580" y="50" font-size="16" font-weight="600">pemba: one database</text>

    <rect x="620" y="75" width="200" height="44" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="720" y="102" font-size="14" text-anchor="middle">Application + pemba</text>

    <line x1="720" y1="119" x2="720" y2="250" stroke="#1a7f37" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="732" y="175" font-size="13" fill="#1a7f37">one transaction:</text>
    <text x="732" y="193" font-size="13" fill="#1a7f37">row and relationship</text>

    <path d="M620 265 v54 a100 10 0 0 0 200 0 v-54" fill="#f6f8fa" stroke="#57606a"/>
    <ellipse cx="720" cy="265" rx="100" ry="10" fill="#f6f8fa" stroke="#57606a"/>
    <text x="720" y="296" font-size="14" text-anchor="middle">App database</text>
    <text x="720" y="315" font-size="13" text-anchor="middle" fill="#57606a">(with pemba's tables)</text>
  </g>
</svg>
